services:
  # 1. Container Único Ultra-Leve: Dashboard Web + Coletor Embutido + WhatsApp Evolution API
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piscicultura_web
    restart: unless-stopped
    mem_limit: 96m
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "2", "--timeout", "60", "--max-requests", "500", "--max-requests-jitter", "50", "src.web.app:app"]
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - PG_HOST=${PG_HOST:-hermes-db}
      - PG_PORT=${PG_PORT:-5432}
      - ENABLE_INTERNAL_SCHEDULER=${ENABLE_INTERNAL_SCHEDULER:-true}
      - ENABLE_WHATSAPP=${ENABLE_WHATSAPP:-true}
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-5050}:5000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - default
      - hermes_mesh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Coletor Autônomo Legado (Desativado: substituído por scheduler thread interna no web)
  collector:
    profiles:
      - legacy-collector
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piscicultura_collector
    restart: unless-stopped
    command: ["python3", "-u", "src/jobs/collector_service.py"]
    env_file:
      - .env

  # 3. Bot Telegram Unificado (Desativado por padrão: foco migrado para WhatsApp Evolution API)
  bot_unificado:
    profiles:
      - telegram-bot
    build:
      context: .
      dockerfile: src/bots/Dockerfile
    container_name: peixe_patel_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - PG_HOST=${PG_HOST:-hermes-db}
      - PG_PORT=${PG_PORT:-5432}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
      - ./reports:/app/reports
      - ./scripts:/app/scripts
    networks:
      - default
      - hermes_mesh

  # 4. PostgreSQL Local (Opcional: Ative com --profile local-db apenas se não houver hermes-db externo)
  postgres:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: piscicultura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DBNAME:-piscicultura_history}
      POSTGRES_USER: ${PG_USER:-admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-admin}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

networks:
  hermes_mesh:
    external: true
    name: ${DOCKER_MESH_NETWORK:-hermes_mesh_network}
