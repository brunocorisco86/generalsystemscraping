{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">Acesso Restrito</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-4">
            <label for="username" class="block text-gray-600 mb-2">Usuário</label>
            <input type="text" name="username" id="username" required 
                   class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-6">
            <label for="password" class="block text-gray-600 mb-2">Senha</label>
            <input type="password" name="password" id="password" required 
                   class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition font-bold">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
